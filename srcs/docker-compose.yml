services:
  postgres:
    container_name: postgres
    build: 
      context: ./requirements/postgresql
      dockerfile: Dockerfile
    env_file: .env
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    container_name: backend
    build: 
      context: ../backend
      dockerfile: Dockerfile
    image: backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # ports:
    #   - "3000:3000"
    networks:
      - transcendence
    restart: always

  prisma-studio:
    image: backend # Nutzt das gleiche Image wie dein Backend
    container_name: prisma-studio
    env_file: .env
    environment:
      - PRISMA_STUDIO_BINARY_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
    command: npx prisma studio --port 5555 --browser none --config /backend/prisma/schema.prisma
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence

  nginx:
    container_name: nginx
    build: 
      context: ./requirements/nginx
    image: nginx
    depends_on:
      - backend
    ports:
      - "3000:443"
    networks:
      - transcendence
    restart: always

networks:
  transcendence:
    driver: bridge

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: /home/hreusing/data/db
      o: bind
secrets:
  db_password:
    file: ../secrets/db_password.txt