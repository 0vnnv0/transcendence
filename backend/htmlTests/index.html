<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Socket Chat Test</title>
<style>
body {
	font-family: Arial;
	max-width: 700px;
	margin: 40px auto;
}
#messages {
	height: 300px;
	border: 1px solid #ccc;
	padding: 10px;
	overflow-y: auto;
	margin-bottom: 10px;
}
input, button {
	padding: 8px;
	margin: 5px;
}
</style>
</head>
<body>

<h2>Socket.IO Chat Test</h2>

<div>
	User ID:
	<input id="userId" value="1">

	Chat ID:
	<input id="chatId" value="1">

	<button onclick="connectSocket()">Connect</button>
</div>

<div id="messages"></div>

<input id="messageInput" placeholder="Type message">
<button onclick="sendMessage()">Send</button>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
let socket;

function log(text) {
	const box = document.getElementById("messages");
	box.innerHTML += "<div>" + text + "</div>";
	box.scrollTop = box.scrollHeight;
}

function connectSocket() {
	const userId = document.getElementById("userId").value;
	const chatId = document.getElementById("chatId").value;

	socket = io("http://localhost:3000");

	socket.on("connect", () => {
		log("Connected: " + socket.id);

		socket.emit("register", {
			userId: Number(userId)
		});

		socket.emit("join_chat", Number(chatId));

		log("Joined chat " + chatId);
	});

	socket.on("new_message", (msg) => {
		log("<b>User " + msg.senderId + ":</b> " + msg.content);
	});

	socket.on("typing", (data) => {
		log("User " + data.userId + " is typing...");
	});
}

function sendMessage() {
	const chatId = document.getElementById("chatId").value;
	const text = document.getElementById("messageInput").value;

	socket.emit("send_message", {
		chatId: Number(chatId),
		content: text
	});

	document.getElementById("messageInput").value = "";
}
</script>

</body>
</html>
