<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Profile Route Tester</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			max-width: 800px;
			margin: 40px auto;
		}

		input, textarea, button {
			display: block;
			margin: 10px 0;
			padding: 8px;
			width: 100%;
		}

		pre {
			background: #eee;
			padding: 15px;
			overflow: auto;
		}
	</style>
</head>
<body>

	<h1>Profile API Tester</h1>

	<h2>JWT Token</h2>
	<input id="token" placeholder="Paste JWT here">
	<button onclick="saveToken()">Save Token</button>

	<hr>

	<h2>GET /profile/:userId</h2>

	<input id="getUserId" type="number" placeholder="User ID">

	<button onclick="getProfile()">
		Get Profile
	</button>

	<hr>

	<h2>PATCH /profile/:userId</h2>

	<input id="patchUserId" type="number" placeholder="User ID">

	<input id="displayName" placeholder="Display Name">

	<textarea
		id="bio"
		placeholder="Bio"
		rows="5">
	</textarea>

	<button onclick="updateProfile()">
		Update Profile
	</button>

	<hr>

	<h2>Response</h2>

	<pre id="output"></pre>

	<script>

		function saveToken()
		{
			localStorage.setItem(
				'token',
				document.getElementById('token').value
			);

			alert('Token saved');
		}

		function getToken()
		{
			return localStorage.getItem('token');
		}

		function show(data)
		{
			document.getElementById('output').textContent =
				JSON.stringify(data, null, 2);
		}

		async function getProfile()
		{
			const userId =
				document.getElementById('getUserId').value;

			try
			{
				const response = await fetch(
					`http://localhost:3000/profile/${userId}`,
					{
						method: 'GET',
						headers: {
							'Authorization':
								`Bearer ${getToken()}`
						}
					}
				);

				const data = await response.json();

				show({
					status: response.status,
					data
				});
			}
			catch (err)
			{
				show(err);
			}
		}

		async function updateProfile()
		{
			const userId =
				document.getElementById('patchUserId').value;

			const body = {};

			const displayName =
				document.getElementById('displayName').value;

			const bio =
				document.getElementById('bio').value;

			if (displayName)
				body.displayName = displayName;

			if (bio)
				body.bio = bio;

			try
			{
				const response = await fetch(
					`http://localhost:3000/profile/${userId}`,
					{
						method: 'PATCH',
						headers: {
							'Content-Type': 'application/json',
							'Authorization':
								`Bearer ${getToken()}`
						},
						body: JSON.stringify(body)
					}
				);

				const data = await response.json();

				show({
					status: response.status,
					data
				});
			}
			catch (err)
			{
				show(err);
			}
		}

		document.getElementById('token').value =
			localStorage.getItem('token') || '';

	</script>

</body>
</html>
